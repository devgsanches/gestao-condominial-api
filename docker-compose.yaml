services:
  api:
    build: .
    # nomeando imagem, gerada a partir do Dockerfile
    image: api-gestao-condominial:v1
    container_name: gestao-condominial-api
    ports:
      - '3333:3333'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: cache
    networks:
      - journey
    depends_on:
      - postgres
      - rabbitmq
      - cache

  postgres:
    image: bitnami/postgresql:latest
    container_name: gestao-condominial-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/bitnami/postgresql
    networks:
      - journey
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - journey
  cache:
    image: bitnami/redis:latest
    container_name: gestao-condominial-cache
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - cache-data:/bitnami/redis/data
    networks:
      - journey

networks:
  journey:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  cache-data:
