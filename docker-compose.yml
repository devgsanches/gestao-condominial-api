services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: gestao-condominial-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 1q2w3e4r
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/bitnami/postgresql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
  cache:
    container_name: gestao-condominial-cache
    # Para produção, usar imagem redis/bitnami
    image: redis 
    ports:
      - 6379:6379
    volumes:
      - cache-data:/data 
volumes:
  postgres-data:
  rabbitmq-data:
  cache-data: