name: CI

on: 
  push:
    branches:
      - main

jobs:
  build-and-push: 
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
      # (first step) - Copy repository code to the runner (VM = ubuntu-latest)
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4   

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      run: pnpm prisma generate

    # (second step) - run all tests and linting checks
    - name: Run tests
      run: pnpm run test

    - name: Run linting checks
      run: pnpm run lint

    - name: Generate HASH
      id: generate-hash
      run: |
        HASH=$(echo $GITHUB_SHA | head -c7)
        echo "hash=$HASH" >> $GITHUB_OUTPUT

      #  logar no container registry (DockerHub)
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

      #  build and push docker image
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
         sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }}
         sanches3g/api-gestao-condominial:latest