name: CI

on: 
  push:
    branches:
      - main

jobs:
  build-and-push: 
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
      # (first step) - Copy repository code to the runner (VM = ubuntu-latest)
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Generate HASH
      id: generate-hash
      run: |
        HASH=$(echo $GITHUB_SHA | head -c7)
        echo "hash=$HASH" >> $GITHUB_OUTPUT

      #  logar no container registry (DockerHub)
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # - name: Build docker image
    #   run: docker build -t sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }} .

    # # enviar imagem após build
    # - name: Push docker image
    #   run: | 
    #     docker push sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }}
    #     docker tag sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }} sanches3g/api-gestao-condominial:latest
    #     docker push sanches3g/api-gestao-condominial:latest

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
         sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }}
         sanches3g/api-gestao-condominial:latest