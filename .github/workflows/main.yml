name: CI

on: 
  push:
    branches:
      - main

jobs:
  build-and-push: 
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Generate HASH
      id: generate-hash
      run: |
        HASH=$(echo $GITHUB_SHA | head -c7)
        echo "hash=$HASH" >> $GITHUB_OUTPUT

    - name: Build docker image
      run: docker build -t sanches3g/api-gestao-condominial:${{ steps.generate-hash.outputs.hash }} .

    #  logar no container registry (DockerHub)
    # enviar imagem após